name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08c2c1ee74b0b6d1f1b96ffb8242e4e76b6e0a72 # v6.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@f26946a3b6f7ca3a5008ec82f1b646b7aecb0ede # v1.275.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake ci

      - name: Build gem
        run: gem build jekyll-minify-flow.gemspec

      - name: Publish to RubyGems
        uses: rubygems/release-gem@3b41f4d7ed688c635ec8f6b45809bf6a95b55b3a # v1.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: jekyll-minify-flow-*.gem
