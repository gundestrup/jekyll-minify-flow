# SonarQube Cloud configuration (CI-based analysis via GitHub Actions).
sonar.organization=gundestrup
sonar.projectKey=gundestrup_jekyll-minify-flow
sonar.projectName=jekyll-minify-flow

sonar.sources=.
sonar.tests=test
# Sources and tests must be disjoint sets — without excluding test/** from
# sonar.sources, those files are classified as main code and counted in
# coverage (lines_to_cover) even though sonar.tests also claims them.
sonar.exclusions=coverage/**,vendor/**,test/**

# SimpleCov JSON report emitted by test_helper.rb in CI
sonar.ruby.coverage.reportPaths=coverage/coverage.json